name: challenge-engine

on:
  # Once a day, 06:00 Israel time (03:00 UTC in summer). The engine only ever
  # writes the NEXT period, so a single daily run is enough — and a live
  # challenge can never be changed under a player.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'הרצה יבשה — רק מדפיס מה היה מוצע, בלי טלגרם ובלי DB'
        type: boolean
        default: false
      force:
        description: 'הצע מחדש גם אם כבר יש הצעה ממתינה'
        type: boolean
        default: false

concurrency:
  group: challenge-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/challenge_engine.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_CHAL_BOT_TOKEN: ${{ secrets.TELEGRAM_CHAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
