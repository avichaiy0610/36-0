name: crowd-telegram

# תור דירוגי הקהל והצמדים, לטלגרם.
#
# הדשבורד דורש לפתוח מחשב, ומאז מיגרציית הפרסום הקצב שבו הבעלים מסתכל בו הוא
# גם הקצב שבו הפיצ'ר נחשף לציבור — שום דירוג לא מוצג לפני שפורסם. אז הכלי
# שמזיז את זה הוא שלוש לחיצות בטלפון.
#
# הלחיצות עצמן לא נקראות כאן: הן מגיעות ל-supabase/functions/crowd-tap, וובהוק
# משלו על בוט משלו. לבוט טלגרם אחד יש וובהוק אחד, ולכן בוט נפרד הוא הדרך
# היחידה שהפיצ'ר הזה לא ייגע בהקשות של האתגרים שכבר עובדות.
#
# פעמיים ביום בכוונה. הפריטים לא בורחים לשום מקום, והודעה שמגיעה כל שעה היא
# הודעה שמפסיקים לקרוא.
on:
  schedule:
    - cron: '0 7,17 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'יבש — מראה מה היה נשלח, בלי לשלוח ובלי לכתוב כלום'
        type: boolean
        default: false
      batch:
        description: 'כמה פריטים לשלוח בהרצה (ברירת מחדל 6)'
        type: string
        default: ''

# קבוצה משלו. בוט נפרד פירושו שאין תחרות מול האתגרים — רק מול הרצה שנייה
# של עצמו, שהייתה שולחת את אותם פריטים פעמיים.
concurrency:
  group: crowd-telegram
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/crowd_telegram.js ${{ inputs.dry && '--dry' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_CROWD_BOT_TOKEN: ${{ secrets.TELEGRAM_CROWD_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CROWD_TG_BATCH: ${{ inputs.batch }}
