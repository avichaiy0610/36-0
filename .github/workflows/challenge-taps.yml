name: challenge-taps

# Kept for diagnostics only. The ✅/🗑️ taps are now handled by the
# supabase/functions/challenge-tap webhook, which answers them the moment they
# happen instead of up to eleven hours later.
#
# The schedule is gone rather than merely slowed: with a webhook registered,
# getUpdates returns 409 on every call, so a polling run can only produce noise.
# Run this by hand with diag to inspect the bot, or ping to send a test button.
# To come back to polling, run telegram-webhook-setup with mode=off first and
# then restore the cron below.
on:
  workflow_dispatch:
    inputs:
      diag:
        description: 'דיאגנוסטיקה — מי הבוט, יש webhook, ומה באמת ממתין בתור (לא צורך לחיצות)'
        type: boolean
        default: false
      ping:
        description: 'שולח הודעת בדיקה עם כפתור אחד מהבוט של האתגרים'
        type: boolean
        default: false

# Still shares the group with challenge-engine: a hand-run diagnostic and the
# daily engine must not talk to Telegram at the same time.
concurrency:
  group: challenge-engine
  cancel-in-progress: false

jobs:
  taps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/challenge_engine.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_CHAL_BOT_TOKEN: ${{ secrets.TELEGRAM_CHAL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAPS_ONLY: ${{ (inputs.diag || inputs.ping) && '0' || '1' }}
          TAPS_DIAG: ${{ inputs.diag && '1' || '' }}
          TAPS_PING: ${{ inputs.ping && '1' || '' }}
