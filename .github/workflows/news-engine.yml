name: news-engine

on:
  # Fired every 30 min by an external scheduler (cron-job.org) that hits the
  # workflow_dispatch API. GitHub's built-in cron was unreliable AND double-fired
  # alongside the external one ("No jobs were run"), so it's intentionally gone.
  workflow_dispatch:
    inputs:
      test:
        description: 'שלח הודעת בדיקה לטלגרם (לוודא שהמנוע עובד)'
        type: boolean
        default: false

# don't let overlapping runs step on each other
concurrency:
  group: news-engine
  cancel-in-progress: false

# the engine generates player SEO pages and commits them back to the repo
permissions:
  contents: write
  actions: write        # so this job can dispatch challenge-taps (see below)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Read the challenge approvals, by dispatching the job that does it.
      #
      # challenge-taps is on GitHub's built-in cron, which fires it every three
      # to eleven HOURS instead of the ten minutes it asks for — so pressing ✅
      # in Telegram went unanswered for most of a day, and Telegram discards an
      # unread update after 24. This workflow is the one trigger on the repo
      # that is actually reliable: an external scheduler hits it every 30
      # minutes. Dispatching rather than running the code here on purpose —
      # challenge-taps and challenge-engine share one getUpdates offset in
      # engine_state and a shared concurrency group, and polling from a third
      # place would race them and drop taps.
      - name: read challenge taps
        continue-on-error: true      # a missed tap must never fail the news run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run challenge-taps.yml --repo ${{ github.repository }}

      - run: node scripts/news_engine.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TEST_PING: ${{ inputs.test }}
      # publish any newly generated player pages (Vercel auto-deploys on push)
      - name: commit new pages
        run: |
          git config user.name "36-0-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          [ -d player ] && git add player || true
          [ -d players ] && git add players || true
          git diff --staged --quiet || (git commit -m "auto: player SEO pages" && git push)
